<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบอัปโหลดรูปภาพ - ส่วนอำนวยการ สำนักวิจัยและพัฒนาการป่าไม้</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="images/logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root {
        --primary-color: #339999;
        --primary-dark: #206b6b;
        --primary-light: #e6f7f7;
        --text-color: #1a2a2a;
        --text-muted: #5a7070;
        --bg-color: #f2f9f9;
        --white: #ffffff;
        --shadow-md: 0 8px 32px rgba(51,153,153,0.12);
        --radius: 16px;
        --radius-sm: 10px;
        --danger: #e74c3c;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg-color);
        font-family: "Prompt", sans-serif;
        color: var(--text-color);
        min-height: 100vh;
    }
    header {
        background: var(--primary-color);
        color: #fff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: var(--shadow-md);
    }
    header img { width: 40px; height: 40px; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; line-height: 1.4; }
    header p { margin: 0; font-size: 13px; opacity: 0.85; }
    main { max-width: 760px; margin: 0 auto; padding: 30px 16px 60px; }
    .card {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 28px;
        margin-bottom: 24px;
    }
    .card h2 { font-size: 18px; margin: 0 0 18px; color: var(--primary-dark); display:flex; align-items:center; gap:8px;}
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    input[type=email], input[type=password], input[type=text], select {
        width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
        border: 1.5px solid #dcecec; font-family: inherit; font-size: 15px;
        margin-bottom: 16px; background: #fafffe;
    }
    input[type=file] { width: 100%; margin-bottom: 16px; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: var(--primary-color); }
    button {
        background: var(--primary-color); color: #fff; border: none;
        padding: 12px 22px; border-radius: 30px; font-family: inherit;
        font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        display: inline-flex; align-items: center; gap: 8px;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { background: #aac; cursor: not-allowed; opacity: 0.6; }
    button.secondary { background: transparent; color: var(--primary-dark); border: 1.5px solid var(--primary-color); }
    button.secondary:hover { background: var(--primary-light); }
    button.danger { background: var(--danger); padding: 6px 12px; font-size: 13px; }
    button.danger:hover { background: #c0392b; }
    .status { margin-top: 10px; font-size: 14px; padding: 10px 14px; border-radius: var(--radius-sm); display: none; }
    .status.show { display: block; }
    .status.ok { background: #e6f9ee; color: #1e824c; }
    .status.err { background: #fdecea; color: #c0392b; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn { padding: 8px 18px; border-radius: 30px; border: 1.5px solid var(--primary-color); background: #fff; color: var(--primary-dark); font-family: inherit; font-weight: 500; cursor: pointer; }
    .tab-btn.active { background: var(--primary-color); color: #fff; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
    .gallery-item { position: relative; border-radius: var(--radius-sm); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); background: #eee; }
    .gallery-item img { width: 100%; height: 180px; object-fit: cover; display: block; cursor: zoom-in; transition: transform 0.2s; }
    .gallery-item img:hover { transform: scale(1.04); }
    .gallery-item .del-btn { position: absolute; top: 8px; right: 8px; }
    .gallery-item .fname { font-size: 12px; color: var(--text-muted); padding: 6px 8px; word-break: break-all; }

    .lightbox-overlay {
        display: none; position: fixed; inset: 0; background: rgba(10,20,20,0.85);
        z-index: 2000; align-items: center; justify-content: center; padding: 30px;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-overlay img { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .lightbox-close {
        position: absolute; top: 20px; right: 28px; color: #fff; font-size: 34px;
        cursor: pointer; line-height: 1; opacity: 0.85;
    }
    .lightbox-close:hover { opacity: 1; }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .userbar { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; }
    .hidden { display: none !important; }
    .help-box { background: var(--primary-light); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13.5px; color: var(--text-muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
    <img src="images/logo.png" alt="logo">
    <div>
        <h1>ระบบอัปโหลดรูปภาพ</h1>
        <p>ส่วนอำนวยการ สำนักวิจัยและพัฒนาการป่าไม้</p>
    </div>
</header>

<main>

    <!-- ล็อกอิน -->
    <div class="card" id="login-card">
        <h2><i class="fas fa-lock"></i> เข้าสู่ระบบ</h2>
        <label for="login-password">รหัสผ่าน</label>
        <input type="password" id="login-password" placeholder="กรอกรหัสผ่าน" maxlength="20">
        <button id="btn-login"><i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ</button>
        <div class="status" id="login-status"></div>
    </div>

    <!-- อัปโหลด (แสดงหลังล็อกอิน) -->
    <div class="card hidden" id="upload-card">
        <div class="top-row">
            <h2><i class="fas fa-upload"></i> อัปโหลดรูปภาพ</h2>
            <div class="userbar">
                <button class="secondary" id="btn-logout"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
            </div>
        </div>

        <label for="upload-category">แกลเลอรี</label>
        <select id="upload-category">
            <option value="activity">ข่าวประชาสัมพันธ์</option>
            <option value="guideline">แนวทาง</option>
        </select>

        <label for="upload-title">คำอธิบายรูป (ไม่บังคับ)</label>
        <input type="text" id="upload-title" placeholder="เช่น กิจกรรมวันที่ 1 สิงหาคม 2569">

        <label for="upload-file">เลือกไฟล์รูปภาพ (เลือกได้หลายไฟล์)</label>
        <input type="file" id="upload-file" accept="image/*" multiple>

        <button id="btn-upload"><i class="fas fa-cloud-upload-alt"></i> อัปโหลด</button>
        <div class="status" id="upload-status"></div>
    </div>

    <!-- รายการรูปภาพ (แสดงหลังล็อกอิน) -->
    <div class="card hidden" id="manage-card">
        <h2><i class="fas fa-images"></i> จัดการรูปภาพ</h2>
        <div class="tabs">
            <button class="tab-btn active" data-cat="activity">ข่าวประชาสัมพันธ์</button>
            <button class="tab-btn" data-cat="guideline">แนวทาง</button>
        </div>
        <div class="gallery-grid" id="gallery-grid">
            <div style="grid-column:1/-1; text-align:center; color:#999; padding:20px;">กำลังโหลด...</div>
        </div>
    </div>

</main>

<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://rxqfmhrxoepjdsmmnqhk.supabase.co';
    const SUPABASE_KEY_VALUE = "sb_publishable_lMMLp3mTrIiSm1Om-HdQxw_oOrHub8g";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY_VALUE);
    const BUCKET = 'gallery-images';

    // บัญชีที่ใช้ร่วมกันเบื้องหลัง (พนักงานไม่ต้องเห็น/จำอีเมลนี้)
    // ต้องสร้างบัญชีนี้ใน Supabase Dashboard -> Authentication -> Users ตามอีเมลด้านล่าง
    // แล้วตั้งรหัสผ่านให้ตรงกับรหัสที่ต้องการให้พนักงานใช้ (ค่าเริ่มต้นตามที่ตกลงกันคือ 5474)
    const SHARED_LOGIN_EMAIL = 'upload-staff@internal.forest.go.th';

    const loginCard = document.getElementById('login-card');
    const uploadCard = document.getElementById('upload-card');
    const manageCard = document.getElementById('manage-card');
    const loginStatus = document.getElementById('login-status');
    const uploadStatus = document.getElementById('upload-status');
    let currentTab = 'activity';

    function showStatus(el, msg, ok) {
        el.textContent = msg;
        el.className = 'status show ' + (ok ? 'ok' : 'err');
    }

    async function refreshSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            loginCard.classList.add('hidden');
            uploadCard.classList.remove('hidden');
            manageCard.classList.remove('hidden');
            loadGalleryList();
        } else {
            loginCard.classList.remove('hidden');
            uploadCard.classList.add('hidden');
            manageCard.classList.add('hidden');
        }
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
        const password = document.getElementById('login-password').value;
        if (!password) { showStatus(loginStatus, 'กรุณากรอกรหัสผ่าน', false); return; }
        const { error } = await supabase.auth.signInWithPassword({ email: SHARED_LOGIN_EMAIL, password });
        if (error) {
            showStatus(loginStatus, 'รหัสผ่านไม่ถูกต้อง', false);
        } else {
            loginStatus.className = 'status';
            document.getElementById('login-password').value = '';
            refreshSession();
        }
    });

    document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await supabase.auth.signOut();
        refreshSession();
    });

    document.getElementById('btn-upload').addEventListener('click', async () => {
        const files = document.getElementById('upload-file').files;
        const category = document.getElementById('upload-category').value;
        const title = document.getElementById('upload-title').value.trim();
        const btn = document.getElementById('btn-upload');

        if (!files || files.length === 0) { showStatus(uploadStatus, 'กรุณาเลือกไฟล์รูปภาพ', false); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังอัปโหลด...';

        let successCount = 0;
        let failMsgs = [];

        for (const file of files) {
            try {
                const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
                const path = `${category}/${Date.now()}_${safeName}`;
                const { error: uploadError } = await supabase.storage.from(BUCKET).upload(path, file, { upsert: false });
                if (uploadError) throw uploadError;

                const { data: publicUrlData } = supabase.storage.from(BUCKET).getPublicUrl(path);
                const { error: insertError } = await supabase.from('gallery').insert({
                    category,
                    image_path: path,
                    image_url: publicUrlData.publicUrl,
                    title: title || null
                });
                if (insertError) throw insertError;
                successCount++;
            } catch (err) {
                failMsgs.push(file.name + ': ' + err.message);
            }
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> อัปโหลด';

        if (failMsgs.length === 0) {
            showStatus(uploadStatus, `อัปโหลดสำเร็จ ${successCount} รูป`, true);
            document.getElementById('upload-file').value = '';
            document.getElementById('upload-title').value = '';
        } else {
            showStatus(uploadStatus, `สำเร็จ ${successCount} รูป, ล้มเหลว: ${failMsgs.join(' | ')}`, false);
        }

        loadGalleryList();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.cat;
            loadGalleryList();
        });
    });

    async function loadGalleryList() {
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#999; padding:20px;">กำลังโหลด...</div>';

        const { data, error } = await supabase
            .from('gallery')
            .select('*')
            .eq('category', currentTab)
            .order('created_at', { ascending: false });

        if (error) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#c0392b; padding:20px;">โหลดข้อมูลไม่สำเร็จ: ${error.message}</div>`;
            return;
        }
        if (!data || data.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#999; padding:20px;">ยังไม่มีรูปภาพในหมวดนี้</div>';
            return;
        }

        grid.innerHTML = '';
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.innerHTML = `
                <img src="${item.image_url}" alt="${item.title || ''}">
                <button class="danger del-btn" title="ลบรูปนี้"><i class="fas fa-trash"></i></button>
                <div class="fname">${item.title || ''}</div>
            `;
            div.querySelector('img').addEventListener('click', () => openLightbox(item.image_url, item.title || ''));
            div.querySelector('.del-btn').addEventListener('click', () => deleteImage(item));
            grid.appendChild(div);
        });
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(url, alt) {
        lightboxImg.src = url;
        lightboxImg.alt = alt;
        lightbox.classList.add('show');
    }
    function closeLightbox() {
        lightbox.classList.remove('show');
        lightboxImg.src = '';
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    async function deleteImage(item) {
        if (!confirm('ต้องการลบรูปนี้ใช่หรือไม่?')) return;
        await supabase.storage.from(BUCKET).remove([item.image_path]);
        const { error } = await supabase.from('gallery').delete().eq('id', item.id);
        if (error) { alert('ลบไม่สำเร็จ: ' + error.message); return; }
        loadGalleryList();
    }

    refreshSession();
</script>
</body>
</html>
